<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React.JS </title>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    

    <script type="text/babel">

        function Contador() {
            const [numero, setNumero] = React.useState(0);

            return (
                <div className="flex flex-col items-start">
                    <p>{numero}</p>
                    <p>{numero > 10 ? 'Maior que 10' : 'Menor ou igual a 10'}</p>
                <button type="button" onClick={() => setNumero(10)}>Atualizar</button>
                <button type="button" onClick={() => setNumero((prevValue) => prevValue + 1)}>Aumentar</button>
                <button type="button" onClick={() => setNumero((prevValue) => prevValue - 1)}>Diminuir</button>
                {numero > 15 && <p>AAAAAAAA</p>}
                </div>
            )
        }

        function App() {
            return (
                <main class="p-3">
                    <Contador />
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>
</html>
