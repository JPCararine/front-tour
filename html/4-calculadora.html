<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rubik&display=swap" rel="stylesheet">
    <link
          rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <title>React.JS </title>
    <style type="text/tailwindcss">
    @theme {
       --text: #EBEBEB;
       --text-secondary: #6B6B6B;
       --primary: #462878;
       --background: #2D2A37;
       --secondary: #7F45E2;
 
       --gradient: 180deg, 
         rgba(0, 0, 0, 0.05) 0%, 
         rgba(255, 255, 255, 0.05) 100%;
 
       --gradient-hover: 180deg, 
         rgba(0, 0, 0, 0.1) 0%, 
         rgba(255, 255, 255, 0.1) 100%;
 
       --shadow: 0px 11px 7px 0px rgba(0, 0, 0, 0.01), 
         0px 7px 7px 0px rgba(0, 0, 0, 0.04), 
         0px 4px 6px 0px rgba(0, 0, 0, 0.10), 
         0px 2px 4px 0px rgba(0, 0, 0, 0.26), 
         0px 0px 2px 0px rgba(0, 0, 0, 0.29), 
         0px 2px 3px 0px rgba(255, 255, 255, 0.06) inset;
 
       --font-sans: 'Rubik', sans-serif;
     }
        
    </style>
</head>
<body class="bg-linear-[180deg,_#807ECE_0%,_#8E7ECE_100%] text-(--text) font-(--font-sans)">
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    

    <script type="text/babel">
      const CounterContext = React.createContext();

        function CounterProvider({children}) {
            const [savedNums, setSavedNums] = React.useState([]);

            function saveNum(numero) {
                setSavedNums((prev) => [...prev, numero]);
            }
            return (
                <CounterContext.Provider value={{ savedNums, saveNum, setSavedNums}}>
                    {children}
                </CounterContext.Provider>
            )
        }
      const textVariants = {
        default: 'text-xl',
        muted: 'text-xl text-(--text-secondary)',
        heading: 'text-2xl',
        blast: 'text-3xl'
      }

    

      function Text({ as = 'span', variant = 'default', className, children, ...props}) {
        return React.createElement(
          as,
          {
            className: `${textVariants[variant]} ${className ? className : ''}`,
            ...props,
          },
          children
        )
        
      }
      const buttonVariants = {
        default: 'bg-(--background)',
        primary: 'bg-(--primary)',
        secondary: 'bg-(--secondary)'
      }

      function Button({ onClick, children, className, variant = 'default', ...props }) {
        return (
          <Text 
          as="button" 
          variant="heading" 
          onClick={onClick}
          className={`
            flex items-center justify-center rounded-xl 
            p-3 cursor-pointer text-(--text) 
            bg-linear-(--gradient) 
            hover:bg-linear-(--gradient-hover)
            shadow-(--shadow)
            ${buttonVariants[variant]}
            ${className ? className : ''}
            `}
            {...props}
          >{children}</Text>
        
      )
      }

      function Card( {children, className, ...props}) {
        return (
          <div className={`
              bg-(--background) shadow-(--shadow) rounded-2xl
              ${className ? className : ''}
            `}
            {...props}>
            {children}
            
            </div>
        )
      }
      const buttons = [
        [
          {input: "CE"},
          {input: "C", className: "flex-1 h-16"},
          {input: "/", variant: "primary"}
        ],
        [
          {input: "7"},
          {input: "8"},
          {input: "9"},
          {input: "*", variant: "primary"}
        ],
        [
          {input: "4"},
          {input: "5"},
          {input: "6"},
          {input: "-", variant: "primary"}
        ],
        [
          {input: "1" },
          {input: "2" },
          {input: "3" },
          {input: "+", variant: "primary"}
        ],
        [
          { input: "0", className: "flex-1 h-16"},
          {input: "," },
          {input: "=", className: "w-16 h-16", variant: "secondary"},
        ]
    ];

      function CalculatorDisplay({result,  operation}) {
        
        return (
          <div className={`
              flex flex-col gap-2 px-[1.375rem]
              cursor-default select-none
              `}>
              <Text as="div" variant="muted" className="flex items-center justify-end h-7">
                    {operation}
              </Text>
              <div className={`
                flex items-center justify-between h-9
                `}>
                 <Text variant="muted" >=</Text>
                 <Text variant="blast">{result}</Text>
                </div>
            
              </div>
        )
      }
      
 
      function Calculator() {
  const [operation, setOperation] = React.useState("");
  const [result, setResult] = React.useState("");
  const {saveNum} = React.useContext(CounterContext);
  

  
  function handleInputClick(input) {
    const isNumber = !isNaN(input);
    if(input === "=") {
      const operationResult = eval(operation.replace(/,/g, "."));
      const parsedResult = parseFloat(operationResult.toFixed(10))
      .toString()
      .replace(/\./g, ",");
      setResult(parsedResult);
      saveNum(`${operation} = ${parsedResult}`);
      return;
    }
    if(input === "C") {
      setResult("");
      setOperation("");
      return;
    }
    if(input === "CE") {
      setResult("");
      setOperation(operation.slice(0, -2));
      return;
    }
    if(result) {
      setOperation(isNumber ? 
      `${result}${input === "," ? "" : " "}${input}` : `${result} ${input}`);
      setResult("")
      return;
      
    }
    
    if(input === "," && !operation.endsWith(",")) {
        setOperation(`${operation},`);
        return;
    }
    if(isNumber) {
      const needsSpace = operation.length > 0 && !operation.endsWith(",") && isNaN(operation.slice(-1));
      setOperation(`${operation}${needsSpace ? " " : ""}${input}`)
      return;
    } else {
      const lastChar = operation.trim().slice(-1);
      const isOperator = isNaN(lastChar) && lastChar !== "";
      if(isOperator) {
        setOperation(`${operation.trim().slice(0, -1).trim()} ${input}`);
        return;
      } 
      
    }
    
    
    
    setOperation(`${operation} ${input}`);
    
  }

        return (
          <Card className={`
            flex flex-col gap-[1.625rem] w-[22.25rem] 
            pt-8 px-8 pb-8 
            `}>
            <CalculatorDisplay operation={operation} result={result}/>
            
            <div className="flex flex-col gap-3">
              {buttons
                .map((row, index) => (
                  <div key={`row-${index}`} className="flex gap-3">
                    {row.map(button =>
                      <Button
                      key={button.input}
                      className={button.className ||"w-16 h-16"}
                      variant={button.variant}
                      onClick={() => handleInputClick(button.input)}
                      >
                        {button.input}
                      </Button>
                    )}
                  </div> 
                ))
              
              }
              
                
              </div>
          </Card>
        )
      }
      function HistoryCalculator() {
        const {savedNums, setSavedNums} = React.useContext(CounterContext);
        function apagarRegistros() {
          setSavedNums([]);
        }
        return (
          <Card className={`
             py-4 px-8
            `}>
            
            <Text as="h1" variant="heading" className="mb-4 ">Histórico de Operações</Text>
            {savedNums.length > 0 && (
            <div className="flex justify-end">
              <Button onClick={apagarRegistros}>
                <i className="fa-solid fa-trash"></i>
              </Button>
            </div>
          )
          }
            <ul className="flex flex-col gap-3">
              
              {savedNums
                .map((value, index) =>
                <Text as="li" key={`${index}`}>{value}</Text>
              )
              }
              
              
            </ul>
            
          </Card>
        )
      }

        function App() {
            return (
            <main className="py-28 px-4 flex flex-col sm:flex-row items-center sm:items-stretch gap-2">
              <CounterProvider>
              <Calculator></Calculator>
              <HistoryCalculator></HistoryCalculator>
              </CounterProvider>
            </main>
        )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(
            <App />
        )

    </script>

    
</body>
</html>
