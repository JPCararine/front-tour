<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React.JS </title>
    <style type="text/tailwindcss">
        @theme {
            --primary: #462878;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>


    <script type="text/babel">

        function Button({children, className, variant, ...props}) {
            return (
                <button
                className={`${buttonVariants[variant]} ${className ? className : ''}`}
                {...props}
                >
                {children}
                </button>
            )
        }

        const buttonVariants = {
            primary: 'bg-(--primary)'
        }

        function Alert1() {
            function handleAlertClick(event) {
                console.log(event);
                alert('Uma mensagem de alerta');
            }
            return (
                <Button onClick={handleAlertClick}>Botão</Button>
            )
        }
        function Alert2() {
            function handleAlertClick(msg) {
                alert(msg);
            }
            return (
                <Button onClick={() => handleAlertClick('Uma mensagem via param!')}>Botão</Button>
            )
        }
        function Alert3() {

            function handleAlertClick(event) {
                alert(event.target.previousSibling.value);

            }
            function handleInputChange(event) {
                console.log(event.target.value);
            }
            return (
                <div>
                    <input type="text" placeholder="Digite algo..." onChange={handleInputChange}/>
                    <Button onClick={handleAlertClick}>Mostrar alerta campo de texto
                    </Button>
                </div>
            )
        }

        function App() {
            return (
                <main className="p-3 flex flex-col items-start">  
                    <Alert1 />
                    <Alert2 />
                    <Alert3 />
                </main>
            )
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />)
    </script>

</body>
</html>
